name: Postman Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SixLabors__LicenseKey: ${{ vars.SIX_LABORS_LICENSE_KEY }}

on:
  workflow_call:
    secrets:
      SecretKey:
        required: true

jobs:
  run-postman:
    runs-on: ubuntu-latest
    environment: Testing

    services:
      postgres:
        image: postgres:latest
        env:
         POSTGRES_PASSWORD: Password123!
         POSTGRES_DB: CookingBlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj*', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Create Six Labors License File
        run: echo "${{ vars.SIX_LABORS_LICENSE_KEY }}" > CookingBlogBackend/PostApiService/sixlabors.lic

      - name: Create wwwroot directory for tests
        run: mkdir -p CookingBlogBackend/PostApiService/wwwroot/images/posts

      - name: Build API
        run: dotnet build CookingBlogBackend/PostApiService/PostApiService.csproj --configuration Debug

      - name: Start API in background
        env: 
          ASPNETCORE_ENVIRONMENT: Development        
          FileStorage__UseFake: "true"
          JwtConfiguration__SecretKey: ${{ secrets.SecretKey }}
          SeedSettings__AdminUserName: ${{ vars.ADMIN_USER_NAME }}
          SeedSettings__AdminPassword: ${{ vars.ADMIN_PASSWORD }}
          SeedSettings__AdminEmail: ${{ vars.SEED_ADMIN_EMAIL }}
          ASPNETCORE_URLS: "http://localhost:5189"
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=CookingBlog;Username=postgres;Password=Password123!"
        run: |
          echo "Waiting for Postgres to warm up..."
          sleep 15
          dotnet run --project CookingBlogBackend/PostApiService/PostApiService.csproj --no-build --no-launch-profile > api.log 2>&1 &
          sleep 20

      - name: Check API Status
        run: |
          sleep 5
          curl -i http://localhost:5189/api/posts || (echo "--- API LOGS ---" && cat api.log && exit 1)

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Tests
        run: |         
          node -e '
            const fs = require("fs");
            const file = "postman/collection.json";
            let content = fs.readFileSync(file, "utf8");
                       
            content = content.replace(/postman-cloud:\/\/\/[a-zA-Z0-9-]+/g, "postman/data/test-image.jpeg");
            
            fs.writeFileSync(file, content, "utf8");
            console.log("✅ Collection successfully patched with local file paths for CI!");
          '          
          newman run postman/collection.json \
            -e postman/environment.json \
            --env-var "baseUrl=http://localhost:5189" \
            --reporters cli,json \
            --reporter-json-export newman-run-report.json || export NEWMAN_FAILED=true

          if [ "$NEWMAN_FAILED" = "true" ]; then
            echo "=========================================="
            echo "❌ Newman tests failed! Analyzing response..."
            echo "=========================================="
            
            if [ -f "newman-run-report.json" ]; then
              echo "--- Last Response Body from Newman Report ---"
              node -e '
                const fs = require("fs");
                try {
                  const report = JSON.parse(fs.readFileSync("newman-run-report.json", "utf8"));
                  const executions = report.run.executions;
                  for (let i = executions.length - 1; i >= 0; i--) {
                    const ex = executions[i];
                    const failedAssertion = ex.assertions && ex.assertions.some(a => a.error);
                    if (failedAssertion || (ex.response && ex.response.code >= 400)) {
                      console.log(`\nFailed Request: ${ex.item.name} (${ex.request.method} ${ex.request.url.toString()})`);
                      console.log(`Status Code: ${ex.response ? ex.response.code : "N/A"}`);
                      console.log("Response Body:");
                      console.log(ex.response ? ex.response.stream.data : "No response body");
                      break;
                    }
                  }
                } catch (e) {
                  console.log("Could not parse newman report:", e.message);
                }
              '
            fi
            exit 1
          fi

      - name: Show API logs
        if: always()
        run: |
          echo "=== api.log (console) ==="
          cat api.log || true
          echo "=== Serilog file logs ==="
          find . -type f -name "api_validation_*.txt" -print -exec cat {} \; || true
          echo "=== wwwroot tree ==="
          find CookingBlogBackend/PostApiService/wwwroot -print || true